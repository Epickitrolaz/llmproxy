services:
  llmproxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: llmproxy:latest
    container_name: llmproxy
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - HTTPS_PROXY=http://172.17.0.1:9999
      - SSL_CERT_FILE=/app/data/ca.crt
    volumes:
      - ./plugins:/app/plugins
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

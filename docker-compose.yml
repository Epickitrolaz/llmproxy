services:
  llmproxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/epickitrolaz/llmproxy:latest
    container_name: llmproxy
    ports:
      - "8000:8000"
      - "8080:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - LLMPROXY_ADMIN_TOKEN=${LLMPROXY_ADMIN_TOKEN:-}
    volumes:
      - ./plugins:/app/plugins
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

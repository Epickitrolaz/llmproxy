services:
  llmproxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/epickitrolaz/llmproxy:latest
    container_name: llmproxy
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    volumes:
      - ./plugins:/app/plugins
      - ./data:/app/data
      - ./llmproxy:/app/llmproxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
